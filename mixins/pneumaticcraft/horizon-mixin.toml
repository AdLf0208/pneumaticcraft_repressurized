[mod]
id = "pneumaticcraft"
version = "0.1.0"
priority = 100

[compatibility]
horizon_revision = "1d63e0a5a37a7a708eb0b32b49bf0dfeb28ed8a9"

# The pure pressure/FE/heat arithmetic (standalone crate lib, injected as
# `crate::game::pneumaticcraft`): the compressor and dynamo ticks, the air
# handler's pressure and leak, the heat exchanger and the dispersion rule.
[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "pneumaticcraft"
source = "runtime.rs"

# Game-side glue: the two block entities, their ticks, the FE buffers, the air
# exchange with the neighbouring machine, the block state and the harness
# commands.
[[module]]
id = "state"
file = "crates/horizon-client/src/game.rs"
name = "pneumaticcraft_state"
source = "support.rs"

# The content half is inside this bundle (`data/pneumaticcraft-content.hmod`, the
# built `content/pneumaticcraft.hmod`): this writes it to `.horizon-cache/` and
# appends it to the dev-mod list, so one `.hnmod` installs the two blocks and the
# code. The registry keeps one file per project, so a split port could not be
# listed; AE2 ships the same pattern.
[[injection]]
id = "embedded-content"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::mods::content_root"
helper = "embedded_content.rs"
bindings = [
  { name = "root", ty = "&std::path::Path", value = "root" },
  { name = "enabled", ty = "&std::collections::BTreeSet<String>", value = "enabled" },
  { name = "dev", ty = "&[std::path::PathBuf]", value = "dev" },
]

# Both blocks get a block entity whatever their template (API 15/129).
[[injection]]
id = "block-entity"
hook = "block_entity"
hook_version = 1
kind = "HEAD"
helper = "block_entity.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "entity", ty = "&mut Option<(String, horizon_world::nbt::Compound)>", value = "entity" },
]

# ... and tick on the server (API 15).
[[injection]]
id = "block-entity-ticks"
hook = "block_entity_ticks"
hook_version = 1
kind = "HEAD"
helper = "block_entity_ticks.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "ticks", ty = "&mut bool", value = "ticks" },
]

# The FE buffer (API 142, `Capabilities.Energy.BLOCK`): 100,000 FE each, reached
# on the faces upstream's `getEnergyHandler` answers.
[[injection]]
id = "block-entity-energy"
hook = "block_entity_energy"
hook_version = 1
kind = "HEAD"
helper = "block_entity_energy.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "energy", ty = "&mut Option<horizon_client::containers::ModEnergyBuffer>", value = "energy" },
]

# One machine tick: leak, convert, disperse air, set `active`, push FE (API 17).
[[injection]]
id = "block-entity-tick"
hook = "block_entity_tick"
hook_version = 1
kind = "HEAD"
helper = "block_entity_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "entity", ty = "&mut horizon_client::containers::ModBlockEntity", value = "entity" },
]

# `/pneumaticcraft info|air|energy` (API 8).
[[injection]]
id = "register-commands"
hook = "register_commands"
hook_version = 1
kind = "HEAD"
helper = "register_commands.rs"
bindings = [
  { name = "commands", ty = "&mut Vec<NativeCommand>", value = "commands" },
]

[[injection]]
id = "perform-command"
hook = "perform_command"
hook_version = 1
kind = "HEAD"
helper = "perform_command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "&NativeServerPlayer", value = "player" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "ran" },
]
